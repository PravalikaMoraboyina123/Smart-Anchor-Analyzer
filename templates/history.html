{% extends "base.html" %}
{% block content %}

<h2>History</h2>

{% for item in history %}
<div class="card">
    <p><strong>Video:</strong> {{ item.video }}</p>
    <p><strong>Score:</strong> {{ item.score }}</p>
</div>
{% else %}
<div class="card">
    <p>No analysis history available yet. <a href="/analyze" style="color: #00E5FF;">Upload a video</a> to start analysis!</p>
</div>
{% endfor %}

{% endblock %}
